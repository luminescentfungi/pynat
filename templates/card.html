<!-- card.html: Template for a single news card, with JS logic for arrows included -->
<div class="news-card-wrapper">
    <div class="arrow-box arrow-box-left">
        <span class="arrow arrow-left" onclick="changeCardPhoto('{{ card.id }}', 'left')">&#8592;</span>
    </div>
    <div class="news-card" id="card-{{ card.id }}">
        <div class="news-card-img">
            {% if card.photo %}
                <img src="{{ card.photo }}" alt="Photo of {{ card.username }}">
            {% else %}
                <div class="no-photo">No photo</div>
            {% endif %}
        </div>
        <div class="news-card-info">
            <div class="news-card-username">{{ card.username or 'undefined' }}</div>
            <div class="news-card-location">{{ card.location or 'undefined' }}</div>
            {% if card.age %}
                <div class="news-card-age">Age: {{ card.age }}</div>
            {% endif %}
        </div>
    </div>
    <div class="arrow-box arrow-box-right" style="display: flex; flex-direction: column; align-items: center;">
        <span class="arrow arrow-right" onclick="changeCardPhoto('{{ card.id }}', 'right')">&#8594;</span>
        <div class="message-box" style="margin-top: 32px;">
            <a href="{{ MSG_TO_URL }}{{ card.id }}" target="_blank" class="message-btn" title="Send message" style="font-size: 2rem; text-decoration: none;">
                &#128233;
            </a>
        </div>
    </div>
</div>
